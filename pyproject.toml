[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-analytics-copilot"
version = "0.1.0"
description = "A safe natural-language-to-SQL analytics copilot with read-only execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThinkNovus Technologies" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlglot>=27,<32",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0", "pytest-cov>=5.0,<7.0", "ruff>=0.9,<1.0"]

[project.scripts]
nl2sql-copilot = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/assets/*.js", "static/assets/*.css"]
